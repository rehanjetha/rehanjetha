<svg width="900" height="380" viewBox="0 0 900 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rehan Jetha profile terminal</title>
  <desc id="desc">A static terminal-style profile snapshot for Rehan Jetha.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#0B1626"/>
    </pattern>
    <clipPath id="line1Clip">
      <rect x="106" y="124" width="0" height="30">
        <animate attributeName="width" from="0" to="330" dur="2.4s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="line2Clip">
      <rect x="106" y="166" width="0" height="30">
        <animate attributeName="width" from="0" to="470" dur="3.4s" begin="3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="line3Clip">
      <rect x="106" y="208" width="0" height="30">
        <animate attributeName="width" from="0" to="650" dur="4.5s" begin="6.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="line4Clip">
      <rect x="106" y="250" width="0" height="30">
        <animate attributeName="width" from="0" to="660" dur="4.4s" begin="11.7s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="380" fill="#050B14"/>
  <rect width="900" height="380" fill="url(#grid)"/>

  <rect x="70" y="44" width="760" height="288" rx="18" fill="#020617" stroke="#243247" stroke-width="2"/>
  <path d="M70 62C70 52.059 78.059 44 88 44H812C821.941 44 830 52.059 830 62V88H70V62Z" fill="#243447"/>
  <circle cx="98" cy="66" r="6" fill="#FF5F57"/>
  <circle cx="122" cy="66" r="6" fill="#FFBD2E"/>
  <circle cx="146" cy="66" r="6" fill="#28C840"/>
  <text x="180" y="78" fill="#94A3B8" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="21">rehan@York</text>

  <g clip-path="url(#line1Clip)">
    <text x="106" y="145" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="20">
      <tspan fill="#5EEAD4">#</tspan><tspan dx="20" fill="#E5E7EB">studying EE at Lassonde</tspan>
    </text>
  </g>

  <g clip-path="url(#line2Clip)">
    <text x="106" y="187" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="20">
      <tspan fill="#5EEAD4">#</tspan><tspan dx="20" fill="#A3E635">$120k Schulich Leader Scholarship</tspan>
    </text>
  </g>

  <g clip-path="url(#line3Clip)">
    <text x="106" y="229" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="20">
      <tspan fill="#5EEAD4">#</tspan><tspan dx="20" fill="#E5E7EB">building QoL projects from tiny inconveniences</tspan>
    </text>
  </g>

  <g clip-path="url(#line4Clip)">
    <text x="106" y="271" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="20">
      <tspan fill="#5EEAD4">#</tspan><tspan dx="20" fill="#60A5FA">automating anything and everything, everywhere!</tspan>
    </text>
  </g>
</svg>
